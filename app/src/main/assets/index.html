<title>Solo Fútbol</title>
<style>
/* Layout: una sola columna de tarjetas grandes, pensada para el pulgar. Tema único: cancha de noche. */
:root{
  color-scheme:dark;
  --bg:#0b1410;
  --surface:#13211b;
  --surface-2:#1a2d25;
  --line:#26392f;
  --text:#eef4ef;
  --muted:#8da598;
  --accent:#ffb238;
  --accent-ink:#2b1a00;
  --ok:#58d68d;
  --body:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.35;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{flex:none;padding:18px 16px 10px;display:flex;align-items:flex-end;gap:12px}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1}
h1 span{color:var(--accent)}
#resumen{color:var(--muted);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.titulo{margin-right:auto;min-width:0}
#actualizar{flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
#actualizar:disabled{opacity:.5}

.tabs{flex:none;display:flex;gap:2px;padding:4px 12px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 10px;color:var(--muted);font-weight:700}
.tab[aria-selected=true]{color:var(--text);border-color:var(--accent)}
#buscar{flex:none;margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
#buscar[hidden]{display:none}

#lista{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}
#lista>li{flex:none}
.canal{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.canal.off{opacity:.55}
.ver{flex:1;min-width:0;background:none;border:0;text-align:left;padding:14px 6px 14px 14px;display:flex;align-items:center;gap:12px}
.ver:active{background:var(--surface-2)}
.play{width:40px;height:40px;flex:none;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.play::after{content:"";border-left:13px solid var(--accent-ink);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.canal.off .play,.canal.wait .play{background:var(--surface-2);border:1px solid var(--line)}
.canal.off .play::after,.canal.wait .play::after{border-left-color:var(--muted)}
.info{min-width:0}
.info b{display:block;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.info small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:6px;color:var(--muted)}
.estado i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.canal.ok .estado{color:var(--ok)}
.canal.ok .estado i{background:var(--ok)}
.fav{flex:none;background:none;border:0;border-left:1px solid var(--line);font-size:22px;padding:0 16px;color:var(--line)}
.fav[aria-pressed=true]{color:var(--accent)}
.nota{color:var(--muted);padding:20px 4px;text-align:center}
.mas{display:block;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700}

#aviso{position:fixed;left:16px;right:16px;bottom:20px;background:var(--text);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;text-align:center;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .2s,transform .2s,visibility .2s;pointer-events:none}
#aviso.ver-aviso{opacity:1;visibility:visible;transform:none}
@media (prefers-reduced-motion:reduce){#aviso{transition:none}}
</style>
</head>

<header>
  <div class="titulo">

  <button id="actualizar" type="button">Actualizar</button>

</div>

var $=function(id){return document.getElementById(id)};
var caja={
  leer:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  guardar:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var nombrePais=(function(){
  var dn=null;try{dn=new Intl.DisplayNames(['es'],{type:'region'})}catch(e){}
  return function(c){if(!c)return'';c=c==='UK'?'GB':c;try{return dn?dn.of(c):c}catch(e){return c}};
})();
function limpiar(n){return n.replace(/\s*(\([^)]*\)|\[[^\]]*\])/g,'').trim()}

// --- Datos: fútbol (curado) y deportes (de la lista pública, filtrada) ---
var senales=caja.leer('sf.senales',null)||SENALES_FUTBOL;
FUTBOL.forEach(function(c){if(!senales[c.id]||!senales[c.id].length)senales[c.id]=SENALES_FUTBOL[c.id]||[]});
function aCanal(d){return{id:'d:'+d.n.toLowerCase(),nombre:d.n,pais:d.c||'',desc:nombrePais(d.c),urls:d.u}}
var deportes=(caja.leer('sf.deportes',null)||DEPORTES_INCLUIDOS).map(aCanal);
function futbol(){return FUTBOL.filter(function(c){return senales[c.id].length}).map(function(c){return{id:c.id,nombre:c.nombre,desc:c.desc,urls:senales[c.id]}})}
function todos(){return futbol().concat(deportes)}

var favs=caja.leer('sf.favs',[]),estado={},tab='futbol',limite=60,pintar=null,app=window.Android;

function estadoDe(c){
  if(c.urls.some(function(x){return estado[x]===true}))return'ok';
  if(!app||c.urls.some(function(x){return estado[x]==null}))return'wait';
  return'off';
}
var TEXTO={ok:'Al aire',wait:'Comprobando señal…',off:'Sin señal ahora'};
var ORDEN={ok:0,wait:1,off:2};
function pesoPais(c){var i=PAISES_PRIMERO.indexOf(c.pais);return i<0?99:i}

function visibles(){
  if(tab==='futbol')return futbol();
  if(tab==='favs')return todos().filter(function(c){return favs.indexOf(c.id)>=0});
  var q=$('buscar').value.trim().toLowerCase();
  return deportes.filter(function(c){return!q||c.nombre.toLowerCase().indexOf(q)>=0||c.desc.toLowerCase().indexOf(q)>=0})
    .sort(function(a,b){return pesoPais(a)-pesoPais(b)||a.nombre.localeCompare(b.nombre,'es')});
}

function tarjeta(c,e){
  var li=document.createElement('li');li.className='canal '+e;
  var b=document.createElement('button');b.className='ver';b.type='button';
  var p=document.createElement('span');p.className='play';
  var info=document.createElement('span');info.className='info';
  var nb=document.createElement('b');nb.textContent=c.nombre;info.appendChild(nb);
  if(c.desc){var d=document.createElement('small');d.textContent=c.desc;info.appendChild(d)}
  var es=document.createElement('span');es.className='estado';es.appendChild(document.createElement('i'));
  es.appendChild(document.createTextNode(app?TEXTO[e]:'Disponible en la app instalada'));
  info.appendChild(es);b.appendChild(p);b.appendChild(info);
  b.addEventListener('click',function(){ver(c)});
  var f=document.createElement('button');f.className='fav';f.type='button';f.textContent='★';
  var esFav=favs.indexOf(c.id)>=0;
  f.setAttribute('aria-pressed',esFav);f.setAttribute('aria-label',(esFav?'Quitar de':'Agregar a')+' favoritos: '+c.nombre);
  f.addEventListener('click',function(){
    if(esFav)favs=favs.filter(function(i){return i!==c.id});else favs.push(c.id);
    caja.guardar('sf.favs',favs);render();
  });
  li.appendChild(b);li.appendChild(f);return li;
}

function render(){
  var lista=$('lista'),arriba=lista.scrollTop;
  var items=visibles().map(function(c,i){return{c:c,e:estadoDe(c),i:i}}).sort(function(a,b){return ORDEN[a.e]-ORDEN[b.e]||a.i-b.i});
  var alAire=items.filter(function(x){return x.e==='ok'}).length;
  $('resumen').textContent=items.length+(items.length===1?' canal':' canales')+(app?' · '+alAire+' al aire':'');
  lista.textContent='';
  if(!items.length){
    var n=document.createElement('li');n.className='nota';
    n.textContent=tab==='favs'?'Aún no tienes favoritos. Toca la estrella de un canal para guardarlo aquí.':'Ningún canal coincide con tu búsqueda.';
    lista.appendChild(n);return;
  }
  var frag=document.createDocumentFragment();
  items.slice(0,limite).forEach(function(x){frag.appendChild(tarjeta(x.c,x.e))});
  if(items.length>limite){
    var li=document.createElement('li'),m=document.createElement('button');
    m.className='mas';m.type='button';m.textContent='Mostrar más canales';
    m.addEventListener('click',function(){limite+=60;render()});
    li.appendChild(m);frag.appendChild(li);
  }
  lista.appendChild(frag);lista.scrollTop=arriba;
}
function pintarLuego(){if(pintar)return;pintar=setTimeout(function(){pintar=null;render()},600)}

var avisoT=null;
function aviso(texto){
  var a=$('aviso');a.textContent=texto;a.classList.add('ver-aviso');
  clearTimeout(avisoT);avisoT=setTimeout(function(){a.classList.remove('ver-aviso')},3500);
}

function ver(c){
  if(!app){aviso('Los canales se ven desde la app instalada en el celular.');return}
  // Primero las señales que respondieron, luego las que faltan comprobar y al final las caídas.
  var peso=function(u){return estado[u]===true?0:estado[u]==null?1:2};
  var urls=c.urls.slice().sort(function(a,b){return peso(a)-peso(b)});
  app.reproducir(c.id,c.nombre,JSON.stringify(urls));
}

function probarTodo(){
  if(!app)return;
  todos().forEach(function(c){c.urls.forEach(function(u){if(estado[u]===undefined){estado[u]=null;app.probar(c.id,u)}})});
}
window.alProbar=function(id,url,ok){estado[url]=!!ok;pintarLuego()};
window.alFallar=function(id){
  var c=todos().filter(function(x){return x.id===id})[0];if(!c)return;
  c.urls.forEach(function(u){estado[u]=false});render();
  aviso(c.nombre+' no responde ahora. Prueba con otro canal.');
};

// Renueva las señales desde la lista pública, por si alguna cambió de dirección.
function renovar(){
  return fetch(LISTA_PUBLICA,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.text();
  }).then(function(texto){
    var fut={},dep={},orden=[],lineas=texto.split(/\r?\n/),info=null;
    for(var i=0;i<lineas.length;i++){
      var l=lineas[i].trim();
      if(l.indexOf('#EXTINF')===0){
        var s=l.replace(/[\w-]+="[^"]*"/g,'');
        var tid=(/tvg-id="([^"]*)"/.exec(l)||[])[1]||'',grupo=(/group-title="([^"]*)"/.exec(l)||[])[1]||'';
        info={n:s.slice(s.indexOf(',')+1).trim(),pais:((/\.([a-z]{2})(@|$)/i.exec(tid)||[])[1]||'').toUpperCase(),dep:/sports/i.test(grupo),cab:false};
      }else if(/^#(EXTVLCOPT|KODIPROP)/i.test(l)){if(info)info.cab=true}
      else if(l&&l.charAt(0)!=='#'){
        if(info&&!info.cab&&/^https?:\/\//i.test(l)&&!EXCLUIR.test(info.n)&&!MAL_ORIGEN.test(l)){
          var geo=/geo-blocked/i.test(info.n),k,puesto=false;
          for(k=0;k<FUTBOL.length;k++){
            if(FUTBOL[k].re.test(info.n)){
              var id=FUTBOL[k].id;fut[id]=fut[id]||[];
              if(geo)fut[id].push(l);else fut[id].unshift(l);puesto=true;break;
            }
          }
          if(!puesto&&info.dep&&!DE_PAGO.test(info.n)){
            var nom=limpiar(info.n),clave=nom.toLowerCase();
            if(!dep[clave]){dep[clave]={n:nom,c:info.pais,u:[]};orden.push(clave)}
            if(dep[clave].u.indexOf(l)<0){if(geo)dep[clave].u.push(l);else dep[clave].u.unshift(l)}
          }
        }
        info=null;
      }
    }
    FUTBOL.forEach(function(c){
      var n=fut[c.id];if(!n||!n.length)return;
      // Se conserva el orden que ya había; las direcciones nuevas van al final.
      var previas=senales[c.id].filter(function(u){return n.indexOf(u)>=0});
      senales[c.id]=previas.concat(n.filter(function(u){return previas.indexOf(u)<0}));
    });
    caja.guardar('sf.senales',senales);
    if(orden.length>=20){
      var nuevos=orden.map(function(k){return dep[k]});
      caja.guardar('sf.deportes',nuevos);deportes=nuevos.map(aCanal);
    }
    caja.guardar('sf.renovado',Date.now());
  });
}

$('actualizar').addEventListener('click',function(){
  var b=$('actualizar');b.disabled=true;b.textContent='Actualizando…';
  estado={};render();
  renovar().catch(function(){aviso('No se pudo renovar la lista. Revisa tu conexión.')}).then(function(){
    render();probarTodo();b.disabled=false;b.textContent='Actualizar';
  });
});
function ponerTab(t){
  tab=t;limite=60;
  ['futbol','deportes','favs'].forEach(function(x){$('tab-'+x).setAttribute('aria-selected',x===t)});
  $('buscar').hidden=t!=='deportes';$('lista').scrollTop=0;render();
}
['futbol','deportes','favs'].forEach(function(x){$('tab-'+x).addEventListener('click',function(){ponerTab(x)})});
$('buscar').addEventListener('input',function(){limite=60;$('lista').scrollTop=0;render()});

render();probarTodo();
if(Date.now()-caja.leer('sf.renovado',0)>12*3600*1000){
  renovar().then(function(){render();probarTodo()}).catch(function(){});
}
})();
</script>
