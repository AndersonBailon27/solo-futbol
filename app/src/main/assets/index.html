<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Solo Fútbol</title>
<style>
/* Layout: una sola columna de tarjetas grandes, pensada para el pulgar. Tema único: cancha de noche. */
:root{
  color-scheme:dark;
  --bg:#0b1410;
  --surface:#13211b;
  --surface-2:#1a2d25;
  --line:#26392f;
  --text:#eef4ef;
  --muted:#8da598;
  --accent:#ffb238;
  --accent-ink:#2b1a00;
  --ok:#58d68d;
  --body:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.35;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{padding:18px 16px 10px;display:flex;align-items:flex-end;gap:12px}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1}
h1 span{color:var(--accent)}
#resumen{color:var(--muted);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.titulo{margin-right:auto}
#actualizar{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
#actualizar:disabled{opacity:.5}

.tabs{display:flex;gap:6px;padding:4px 16px 10px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;color:var(--muted);font-weight:700}
.tab[aria-selected=true]{color:var(--text);border-color:var(--accent)}

#lista{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}
.canal{flex:none;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.canal.off{opacity:.55}
.ver{flex:1;min-width:0;background:none;border:0;text-align:left;padding:14px 6px 14px 14px;display:flex;align-items:center;gap:12px}
.ver:active{background:var(--surface-2)}
.play{width:40px;height:40px;flex:none;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.play::after{content:"";border-left:13px solid var(--accent-ink);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.canal.off .play,.canal.wait .play{background:var(--surface-2);border:1px solid var(--line)}
.canal.off .play::after,.canal.wait .play::after{border-left-color:var(--muted)}
.info{min-width:0}
.info b{display:block;font-size:17px;font-weight:800}
.info small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:6px;color:var(--muted)}
.estado i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.canal.ok .estado{color:var(--ok)}
.canal.ok .estado i{background:var(--ok)}
.fav{background:none;border:0;border-left:1px solid var(--line);font-size:22px;padding:0 16px;color:var(--line)}
.fav[aria-pressed=true]{color:var(--accent)}
.nota{color:var(--muted);padding:20px 4px;text-align:center}

#aviso{position:fixed;left:16px;right:16px;bottom:20px;background:var(--text);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;text-align:center;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .2s,transform .2s,visibility .2s;pointer-events:none}
#aviso.ver-aviso{opacity:1;visibility:visible;transform:none}
@media (prefers-reduced-motion:reduce){#aviso{transition:none}}
</style>
</head>
<body>

  <button class="tab" role="tab" id="tabFavs" aria-selected="false">Favoritos</button>

var $=function(id){return document.getElementById(id)};
var caja={
  leer:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  guardar:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var senales=caja.leer('sf.senales',null)||INCLUIDAS;   // id -> [url]
CANALES.forEach(function(c){if(!senales[c.id]||!senales[c.id].length)senales[c.id]=INCLUIDAS[c.id]||[]});
var favs=caja.leer('sf.favs',[]),estado={},tab='todos',pintar=null,app=window.Android;

function estadoDe(c){
  var u=senales[c.id];
  if(u.some(function(x){return estado[x]===true}))return'ok';
  if(!app||u.some(function(x){return estado[x]===undefined}))return'wait';
  return'off';
}
var TEXTO={ok:'Al aire',wait:'Comprobando señal…',off:'Sin señal ahora'};
var ORDEN={ok:0,wait:1,off:2};

function render(){
  var lista=$('lista'),items=CANALES.filter(function(c){return senales[c.id].length&&(tab==='todos'||favs.indexOf(c.id)>=0)});
  var conEstado=items.map(function(c,i){return{c:c,e:estadoDe(c),i:i}}).sort(function(a,b){return ORDEN[a.e]-ORDEN[b.e]||a.i-b.i});
  var todos=CANALES.filter(function(c){return senales[c.id].length});
  var alAire=todos.filter(function(c){return estadoDe(c)==='ok'}).length;
  $('resumen').textContent=todos.length+' canales de fútbol'+(app?' · '+alAire+' al aire':'');
  lista.textContent='';
  if(!conEstado.length){
    var n=document.createElement('li');n.className='nota';
    n.textContent='Aún no tienes favoritos. Toca la estrella de un canal para guardarlo aquí.';
    lista.appendChild(n);return;
  }
  conEstado.forEach(function(x){
    var c=x.c,li=document.createElement('li');li.className='canal '+x.e;
    var b=document.createElement('button');b.className='ver';b.type='button';
    var p=document.createElement('span');p.className='play';
    var info=document.createElement('span');info.className='info';
    var nb=document.createElement('b');nb.textContent=c.nombre;
    var d=document.createElement('small');d.textContent=c.desc;
    var e=document.createElement('span');e.className='estado';e.appendChild(document.createElement('i'));
    e.appendChild(document.createTextNode(app?TEXTO[x.e]:'Disponible en la app instalada'));
    info.appendChild(nb);info.appendChild(d);info.appendChild(e);
    b.appendChild(p);b.appendChild(info);
    b.addEventListener('click',function(){ver(c)});
    var f=document.createElement('button');f.className='fav';f.type='button';f.textContent='★';
    var esFav=favs.indexOf(c.id)>=0;
    f.setAttribute('aria-pressed',esFav);f.setAttribute('aria-label',(esFav?'Quitar de':'Agregar a')+' favoritos: '+c.nombre);
    f.addEventListener('click',function(){
      if(esFav)favs=favs.filter(function(i){return i!==c.id});else favs.push(c.id);
      caja.guardar('sf.favs',favs);render();
    });
    li.appendChild(b);li.appendChild(f);lista.appendChild(li);
  });
}
function pintarLuego(){if(pintar)return;pintar=setTimeout(function(){pintar=null;render()},400)}

var avisoT=null;
function aviso(texto){
  var a=$('aviso');a.textContent=texto;a.classList.add('ver-aviso');
  clearTimeout(avisoT);avisoT=setTimeout(function(){a.classList.remove('ver-aviso')},3500);
}

function ver(c){
  if(!app){aviso('Los canales se ven desde la app instalada en el celular.');return}
  // Primero las señales que respondieron, luego las que faltan comprobar y al final las caídas.
  var peso=function(u){return estado[u]===true?0:estado[u]===undefined?1:2};
  var urls=senales[c.id].slice().sort(function(a,b){return peso(a)-peso(b)});
  app.reproducir(c.id,c.nombre,JSON.stringify(urls));
}

function probarTodo(){
  if(!app)return;
  CANALES.forEach(function(c){senales[c.id].forEach(function(u){if(estado[u]===undefined)app.probar(c.id,u)})});
}
window.alProbar=function(id,url,ok){estado[url]=!!ok;pintarLuego()};
window.alFallar=function(id){
  var c=CANALES.filter(function(x){return x.id===id})[0];if(!c)return;
  senales[id].forEach(function(u){estado[u]=false});render();
  aviso(c.nombre+' no responde ahora. Prueba con otro canal.');
};

// Renueva las señales desde la lista pública, por si alguna cambió de dirección.
function renovar(){
  return fetch(LISTA_PUBLICA,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.text();
  }).then(function(texto){
    var nuevas={},lineas=texto.split(/\r?\n/),nombre=null;
    for(var i=0;i<lineas.length;i++){
      var l=lineas[i].trim();
      if(l.indexOf('#EXTINF')===0){var s=l.replace(/[\w-]+="[^"]*"/g,'');nombre=s.slice(s.indexOf(',')+1).trim()}
      else if(l&&l.charAt(0)!=='#'){
        if(nombre&&!EXCLUIR.test(nombre)&&!MAL_ORIGEN.test(l)&&/^https?:\/\//i.test(l)){
          for(var k=0;k<CANALES.length;k++){
            if(CANALES[k].re.test(nombre)){
              var id=CANALES[k].id;(nuevas[id]=nuevas[id]||[]);
              if(/geo-blocked/i.test(nombre))nuevas[id].push(l);else nuevas[id].unshift(l);
              break;
            }
          }
        }
        nombre=null;
      }
    }
    var cambio=false;
    CANALES.forEach(function(c){
      var n=nuevas[c.id];if(!n||!n.length)return;
      // Se conserva el orden que ya había; las direcciones nuevas van al final.
      var previas=senales[c.id].filter(function(u){return n.indexOf(u)>=0});
      var extra=n.filter(function(u){return previas.indexOf(u)<0});
      var lista=previas.concat(extra);
      if(lista.join('|')!==senales[c.id].join('|')){senales[c.id]=lista;cambio=true}
    });
    caja.guardar('sf.senales',senales);caja.guardar('sf.renovado',Date.now());
    return cambio;
  });
}

$('actualizar').addEventListener('click',function(){
  var b=$('actualizar');b.disabled=true;b.textContent='Actualizando…';
  estado={};render();
  renovar().catch(function(){aviso('No se pudo renovar la lista. Revisa tu conexión.')}).then(function(){
    render();probarTodo();b.disabled=false;b.textContent='Actualizar';
  });
});
function ponerTab(t){
  tab=t;$('tabTodos').setAttribute('aria-selected',t==='todos');$('tabFavs').setAttribute('aria-selected',t==='favs');render();
}
$('tabTodos').addEventListener('click',function(){ponerTab('todos')});
$('tabFavs').addEventListener('click',function(){ponerTab('favs')});

render();probarTodo();
if(Date.now()-caja.leer('sf.renovado',0)>12*3600*1000){
  renovar().then(function(cambio){if(cambio){render();probarTodo()}}).catch(function(){});
}
})();
</script>
