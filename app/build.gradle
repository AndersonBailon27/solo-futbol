plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.jhon.solofutbol'
    compileSdk 34

    defaultConfig {
        applicationId 'pe.jhon.solofutbol'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        propia {
            storeFile file('solofutbol.jks')
            storePassword 'solofutbol123'
            keyAlias 'solofutbol'
            keyPassword 'solofutbol123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.propia
        }
        debug {
            signingConfig signingConfigs.propia
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Reproductor de video nativo (señales en vivo HLS)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
