name: Construir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk SoloFutbol.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoloFutbol-apk
          path: SoloFutbol.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Solo Futbol v1.0.${{ github.run_number }}
          body: Descarga **SoloFutbol.apk** desde el celular e instálala.
          files: SoloFutbol.apk
          make_latest: true
